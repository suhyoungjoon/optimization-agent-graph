[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optimization-agent-graph"
version = "0.1.0"
description = "Workflow agent that improves optimization engines: run, analyze, propose, validate, apply"
requires-python = ">=3.11"
dependencies = [
    # 코어는 커밋으로 고정한다. 지금은 코어 PR #20(공개 API 보강)의 head 커밋이며, 머지되면 머지 커밋·태그로 올린다. 올릴 때는 docs/handoff.md도 같은 커밋으로 갱신
    "optimization-agent-harness @ git+https://github.com/suhyoungjoon/optimization-agent-harness.git@15d95b391cbb0b217d999fab12bf9c1151e1aa3c",
    "pyyaml>=6.0",
    # X1 오케스트레이션. 버전별 API 차이가 있어 고정한다 (올릴 때는 interrupt·Command·SqliteSaver를 다시 확인)
    "langgraph==1.2.12",
    "langgraph-checkpoint-sqlite==3.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["workflow*", "engines*", "modelreg*"]   # core·domains·api·scripts·configs는 코어 패키지 이름이라 쓰지 않는다

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
